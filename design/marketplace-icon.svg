<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="ioefw-marketplace-icon-title">
	<title id="ioefw-marketplace-icon-title">Inline Order Editor</title>
	<!--
		The WooCommerce.com Marketplace product icon: 160 x 160, square corners (the Marketplace rounds them),
		and the artwork inside the middle 112 x 112. The colour is also the listing's highlight card colour.
	-->
	<rect width="160" height="160" fill="#2563EB"/>
	<g transform="translate(80 80) scale(0.585) translate(-128 -128)">
		<!-- The order's items. -->
		<rect x="34" y="42" width="188" height="172" rx="16" fill="#FFFFFF"/>
		<!-- A line of the order: name, quantity, total. -->
		<rect x="54" y="66" width="72" height="13" rx="6.5" fill="#153847"/>
		<rect x="146" y="66" width="20" height="13" rx="6.5" fill="#BFD0FA"/>
		<rect x="176" y="66" width="28" height="13" rx="6.5" fill="#BFD0FA"/>
		<!-- A second line, with its quantity being changed where it stands. -->
		<rect x="54" y="106" width="56" height="13" rx="6.5" fill="#153847"/>
		<rect x="136" y="92" width="40" height="38" rx="6" fill="#EDF3FF"/>
		<rect x="136" y="126" width="40" height="5" rx="2.5" fill="#2563EB"/>
		<rect x="146" y="102" width="12" height="13" rx="6.5" fill="#153847"/>
		<rect x="162" y="99" width="4" height="20" rx="2" fill="#2563EB"/>
		<rect x="184" y="106" width="20" height="13" rx="6.5" fill="#BFD0FA"/>
		<!-- The empty row, waiting for the next item. -->
		<path d="M54 150h150" fill="none" stroke="#8FADF5" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>
		<rect x="54" y="164" width="34" height="34" rx="10" fill="#2563EB"/>
		<path d="M71 173v16M63 181h16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
		<rect x="100" y="175" width="78" height="12" rx="6" fill="#D7E5EA"/>
	</g>
</svg>
